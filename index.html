<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Shore Book">
<meta name="theme-color" content="#ECE8DF">
<title>Shore Book · Galápagos 2026</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --stone:#ECE8DF;
  --sand:#FBF9F4;
  --ink:#171A1C;          /* basalt */
  --sea:#135B6B;
  --sea-tint:#D8E6E7;
  --rosso:#B4472A;        /* Sally Lightfoot */
  --reel:#8A6B1F;         /* lava-lizard ochre */
  --olio:#4C6A3A;         /* opuntia */
  --booby:#2C7AA3;
  --rule:#CAC5B8;
  --mute:#686D70;
  --display:"Didot","Bodoni 72",Didot LT STD,"Hoefler Text",Georgia,serif;
  --body:"Avenir Next",Avenir,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"Menlo","SF Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--stone);
  color:var(--ink);
  font-family:var(--body);
  font-size:16px;
  line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom);
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:620px;margin:0 auto;padding:0 18px 72px}
button{font:inherit;color:inherit}
.hidden{display:none !important}

/* ---------- brand strip ---------- */
.brand{
  display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;
  padding:14px 0 12px;border-bottom:1px solid var(--rule);
}
.brand img{width:38px;height:38px;display:block;flex:0 0 auto}
.brand-name{
  font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--mute);line-height:1.35;
}
.brand-name b{display:block;font-weight:400;color:var(--ink)}
.net{margin-left:auto;font-family:var(--mono);font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--mute);display:flex;align-items:center;gap:6px}
.net i{width:7px;height:7px;border-radius:50%;background:var(--rule);display:block}
.net.on i{background:var(--olio)}

/* ---------- masthead ---------- */
header{padding:18px 0 0}
.kicker{
  font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--mute);display:flex;justify-content:space-between;align-items:baseline;gap:10px;
}
h1{
  font-family:var(--display);font-weight:400;font-size:42px;line-height:.98;
  margin:8px 0 4px;letter-spacing:-.01em;
}
.sub{font-size:13px;color:var(--mute);margin:0 0 14px}

/* ---------- day rail ---------- */
.ports{display:flex;gap:6px;overflow-x:auto;padding:0 0 12px;margin:0 -18px;
  padding-left:18px;padding-right:18px;scrollbar-width:none}
.ports::-webkit-scrollbar{display:none}
.port-btn{
  flex:0 0 auto;background:transparent;border:1px solid var(--rule);
  border-radius:2px;padding:6px 10px 5px;font-family:var(--mono);font-size:11px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--mute);cursor:pointer;
  text-align:left;line-height:1.25;
}
.port-btn small{display:block;font-size:9px;letter-spacing:.1em;opacity:.8}
.port-btn.now{border-color:var(--rosso);color:var(--rosso)}
.port-btn[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--stone)}
.port-btn:focus-visible{outline:2px solid var(--sea);outline-offset:2px}

/* ---------- tide bar (signature) — here it counts down to the panga ---------- */
.tide{border:1px solid var(--ink);background:var(--sand);padding:12px 13px 11px;margin:2px 0 18px}
.tide-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tide-label{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.tide-clock{font-family:var(--display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.tide-clock.warn{color:var(--rosso)}
.tide-track{
  position:relative;height:16px;margin:10px 0 8px;border:1px solid var(--rule);
  background:repeating-linear-gradient(-45deg,transparent 0 4px,var(--rule) 4px 5px);
}
.tide-fill{position:absolute;inset:0 auto 0 0;background:var(--sea-tint);
  border-right:2px solid var(--sea);transition:width .6s ease}
@media (prefers-reduced-motion:reduce){.tide-fill{transition:none}}
.tide-foot{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--mute);flex-wrap:wrap}
.tide-foot input{
  font-family:var(--mono);font-size:12px;border:0;border-bottom:1px solid var(--rule);
  background:transparent;color:var(--ink);padding:1px 0;
}
.tide-foot input:focus{outline:none;border-bottom-color:var(--sea)}
.tide-what{font-size:13px;color:var(--ink);margin:2px 0 0}

/* ---------- dock strip ---------- */
.dock{border-left:3px solid var(--sea);padding:2px 0 2px 12px;margin:0 0 20px;font-size:14px}
.dock b{font-weight:600}
.dock span{display:block;color:var(--mute);font-size:13px;margin-top:2px}
.dock.warn{border-left-color:var(--rosso)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin:0 -6px 18px;position:sticky;top:0;
  background:var(--stone);z-index:5;padding-top:env(safe-area-inset-top)}
.tab{
  flex:1 1 0;min-width:0;background:none;border:0;border-bottom:2px solid transparent;
  margin-bottom:-1px;padding:10px 0 9px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:0;text-transform:uppercase;color:var(--mute);cursor:pointer;position:relative;
}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--rosso)}
.tab:focus-visible{outline:2px solid var(--sea);outline-offset:-2px}
.tab .badge{position:absolute;top:4px;right:2px;min-width:14px;height:14px;padding:0 3px;border-radius:7px;
  background:var(--rosso);color:#fff;font-size:9px;line-height:14px;letter-spacing:0}

/* ---------- section heads & notes ---------- */
h2{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.05;margin:26px 0 8px}
h3{font-family:var(--mono);font-weight:400;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--mute);margin:22px 0 10px}
.note{font-size:14px;color:var(--mute);margin:0 0 14px}
.lede{font-family:var(--display);font-size:19px;line-height:1.35;margin:0 0 14px}
p{margin:0 0 10px}

/* ---------- briefing card ---------- */
.brief{background:var(--sand);border:1px solid var(--rule);padding:14px 14px 6px;margin:0 0 20px}
.brief .kick{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--rosso);margin:0 0 6px}
.brief p{font-size:15px}
.brief ul{margin:4px 0 10px;padding-left:18px;font-size:14px}
.brief li{margin:0 0 4px}

/* ---------- sounding rail (activities) ---------- */
.rail{position:relative;margin:0;padding:0 0 0 34px;list-style:none}
.rail::before{content:"";position:absolute;left:9px;top:10px;bottom:26px;width:1px;background:var(--rule)}
.stop{position:relative;padding:0 0 22px}
.dot{
  position:absolute;left:-34px;top:2px;width:19px;height:19px;border-radius:50%;
  border:1px solid var(--ink);background:var(--sand);font-family:var(--mono);font-size:10px;
  display:flex;align-items:center;justify-content:center;
}
.stop.live .dot{background:var(--rosso);border-color:var(--rosso);color:#fff}
.stop.past .dot{background:var(--rule);border-color:var(--rule);color:var(--sand)}
.stop-time{font-family:var(--mono);font-size:11px;color:var(--mute);letter-spacing:.04em}
.stop-name{font-family:var(--display);font-size:23px;line-height:1.1;margin:2px 0 4px}
.stop-name small{font-family:var(--body);font-size:13px;color:var(--mute);display:block;margin-top:2px}
.how{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  border:1px solid currentColor;border-radius:2px;padding:1px 5px;margin:0 4px 4px 0;color:var(--sea)}
.how.wet{color:var(--booby)} .how.dry{color:var(--reel)} .how.snorkel,.how.kayak{color:var(--sea)}
.how.flag{color:var(--rosso)} .how.ship{color:var(--mute)}
.stop p{font-size:15px}
.stop .look{font-size:14px;color:var(--ink);border-left:2px solid var(--olio);padding-left:10px;margin:8px 0}
.stop .x{font-size:13px;color:var(--mute)}
.more{background:none;border:0;padding:0;font-family:var(--mono);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--sea);cursor:pointer;margin:2px 0 0}

/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{border:1px solid var(--rule);background:var(--sand);border-radius:14px;padding:4px 10px;font-size:13px;
  cursor:pointer;line-height:1.3;display:inline-flex;align-items:center;gap:6px}
.chip.seen{border-color:var(--olio);color:var(--olio)}
.chip.seen::before{content:"✓";font-size:11px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--stone)}
.chip.k{border-color:var(--rosso)}
.chip .sw{width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,.25)}

/* ---------- cards ---------- */
.card{background:var(--sand);border:1px solid var(--rule);padding:12px 13px;margin:0 0 10px;position:relative}
.card h4{font-family:var(--display);font-weight:400;font-size:21px;line-height:1.1;margin:0 0 2px}
.card .t{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.card p{font-size:14px;margin:6px 0 0}
.card .x{font-size:13px;color:var(--mute)}
.card.tap{cursor:pointer}
.card.hi{border-color:var(--ink)}

/* ---------- species rows ---------- */
.sp{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--rule);cursor:pointer}
.sp:last-child{border-bottom:0}
.sp-mark{flex:0 0 auto;width:22px;height:22px;border:1px solid var(--ink);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:12px;background:var(--sand);cursor:pointer;padding:0}
.sp-mark.on{background:var(--olio);border-color:var(--olio);color:#fff}
.sp-body{flex:1 1 auto;min-width:0}
.sp-n{font-size:16px;line-height:1.25}
.sp-s{font-size:12px;color:var(--mute);font-style:italic}
.sp-m{font-size:12px;color:var(--mute);margin-top:2px}
.st{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;border-radius:2px;
  padding:1px 4px;margin-left:6px;vertical-align:2px;border:1px solid var(--rule);color:var(--mute);font-style:normal}
.st.E{border-color:var(--rosso);color:var(--rosso)}
.st.e{border-color:var(--reel);color:var(--reel)}
.st.M{border-color:var(--sea);color:var(--sea)}
.today-tag{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--sea)}

/* ---------- reference photos ---------- */
.sp-img{flex:0 0 auto;width:54px;height:54px;object-fit:cover;display:block;background:var(--rule)}
span.sp-img{display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:22px;color:var(--sand)}
.cand-img{float:right;width:64px;height:64px;object-fit:cover;margin:0 0 6px 10px;background:var(--rule)}
span.cand-img{display:none}
.hero{display:block;width:calc(100% + 36px);margin:-16px -18px 0;max-height:46vh;object-fit:cover;background:var(--rule)}
.credit{font-size:11px;color:var(--mute);margin:4px 0 12px}
.credit a{color:inherit}
.credits{font-size:12px;color:var(--mute);margin:0 0 12px}
.credits summary{cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.credits ul{padding-left:16px}
.credits a{color:inherit}

/* ---------- progress ---------- */
.prog{display:flex;align-items:baseline;gap:10px;margin:0 0 6px}
.prog b{font-family:var(--display);font-weight:400;font-size:44px;line-height:1}
.prog span{color:var(--mute);font-size:14px}
.bar{height:8px;border:1px solid var(--rule);background:var(--sand);margin:0 0 16px}
.bar i{display:block;height:100%;background:var(--olio)}

/* ---------- search & key ---------- */
.search{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--rule);background:var(--sand);
  border-radius:2px;color:var(--ink)}
.search:focus{outline:none;border-color:var(--sea)}
.keyrow{margin:10px 0 0}
.keyrow .lab{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);margin:10px 0 0}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--ink);
  background:var(--ink);color:var(--stone);padding:10px 14px;border-radius:2px;font-family:var(--mono);font-size:11px;
  letter-spacing:.12em;text-transform:uppercase;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.big{width:100%;padding:16px 14px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
textarea,.field{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--rule);
  background:var(--sand);border-radius:2px;color:var(--ink)}
textarea{min-height:110px;resize:vertical}
textarea:focus,.field:focus{outline:none;border-color:var(--sea)}

/* ---------- camera ---------- */
.drop{border:1px dashed var(--ink);background:var(--sand);padding:18px 14px;text-align:center;margin:0 0 12px}
.drop p{font-size:13px;color:var(--mute);margin:8px 0 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 16px}
.ph{position:relative;aspect-ratio:1;background:var(--rule);overflow:hidden;cursor:pointer;border:0;padding:0}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .pst{position:absolute;left:4px;bottom:4px;right:4px;font-family:var(--mono);font-size:9px;letter-spacing:.06em;
  text-transform:uppercase;background:rgba(23,26,28,.78);color:#fff;padding:2px 4px;border-radius:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.ph .pst.ok{background:rgba(76,106,58,.9)}
.ph .pst.q{background:rgba(138,107,31,.9)}
.ph.sel{outline:3px solid var(--rosso);outline-offset:-3px}
.result{background:var(--sand);border:1px solid var(--ink);margin:0 0 18px}
.result img{width:100%;display:block;max-height:58vh;object-fit:contain;background:#111}
.result .in{padding:12px 13px}
.verdict{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 4px}
.verdict.confident{color:var(--olio)} .verdict.possible{color:var(--reel)} .verdict.cannot_tell,.verdict.no_wildlife{color:var(--rosso)}
.cand{border-top:1px solid var(--rule);padding:10px 0}
.cand:first-of-type{border-top:0}
.cand .cn{font-family:var(--display);font-size:21px;line-height:1.1}
.conf{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-left:6px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.split div{font-size:13px;border-top:2px solid var(--ink);padding-top:6px}
.split div.inf{border-top-color:var(--reel)}
.split b{display:block;font-family:var(--mono);font-weight:400;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:2px}
.when{font-size:12px;color:var(--mute)}
.when select{font:inherit;font-size:12px;border:0;border-bottom:1px solid var(--rule);background:transparent;color:var(--ink);max-width:100%}

/* ---------- sheet (species) ---------- */
.veil{position:fixed;inset:0;background:rgba(23,26,28,.42);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;z-index:41;background:var(--stone);
  border-top:1px solid var(--ink);padding:16px 18px calc(28px + env(safe-area-inset-bottom));
  -webkit-overflow-scrolling:touch}
.sheet-in{max-width:620px;margin:0 auto}
.sheet-in{position:relative}
.sheet .close{position:absolute;top:0;right:0;background:var(--sand);border:1px solid var(--rule);border-radius:50%;
  width:32px;height:32px;cursor:pointer;font-size:18px;line-height:1;z-index:2}
.sheet h2{margin:2px 0 2px;font-size:32px}
.facts{font-size:15px}
.facts dt{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:14px 0 2px}
.facts dd{margin:0}

/* ---------- chart ---------- */
.chartwrap{position:relative;border:1px solid var(--ink);background:#DCE7E8;height:62vh;min-height:340px;
  overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.chartwrap svg{display:block;width:100%;height:100%}
.chart-ctl{display:flex;gap:6px;margin:0 0 8px}
.chart-ctl button{flex:0 0 auto;min-width:40px;height:36px;border:1px solid var(--ink);background:var(--sand);border-radius:2px;
  font-family:var(--mono);font-size:14px;cursor:pointer;padding:0}
.chart-ctl button.wide{flex:1 1 0;padding:0 8px;font-size:9px;letter-spacing:.1em;text-transform:uppercase}
.attrib{position:absolute;left:6px;bottom:4px;font-size:9px;color:var(--mute);background:rgba(251,249,244,.7);padding:0 4px}
.locbar{font-size:13px;color:var(--mute);margin:8px 0 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- journal ---------- */
.jday{border-top:1px solid var(--ink);padding:14px 0 6px;margin:0 0 6px}
.jday .t{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.jday h4{font-family:var(--display);font-weight:400;font-size:26px;margin:2px 0 6px;line-height:1.1}
.jday .ai{font-family:var(--display);font-size:17px;line-height:1.45;margin:6px 0 10px}
.thumbs{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 10px}
.thumbs img{width:62px;height:62px;object-fit:cover;display:block}
.learned{font-size:14px;padding-left:18px;margin:4px 0 10px}

/* ---------- know ---------- */
.know{list-style:none;padding:0;margin:0}
.know li{padding:9px 0;border-bottom:1px solid var(--rule);font-size:15px}
.know li:last-child{border-bottom:0}
.set{display:grid;gap:4px;margin:0 0 14px}
.set label{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.set select{font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--rule);background:var(--sand);border-radius:2px;color:var(--ink)}
table.cmp{width:100%;border-collapse:collapse;font-size:13px;margin:4px 0 12px}
table.cmp th,table.cmp td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--rule);vertical-align:top}
table.cmp th{font-family:var(--mono);font-weight:400;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}

/* ---------- toast & hail ---------- */
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--ink);color:var(--stone);padding:10px 14px;font-size:14px;border-radius:2px;z-index:60;
  max-width:calc(100% - 36px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.haptic-switch{position:fixed;left:-200px;top:0;opacity:0;pointer-events:none}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--rule);margin-top:30px;padding-top:12px;display:flex;justify-content:space-between;
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}

/* ---------- print: the journal and nothing else ---------- */
#print{display:none}
@media print{
  @page{margin:16mm 14mm}
  body{background:#fff}
  .wrap,.toast,.veil,.sheet{display:none !important}
  #print{display:block;font-family:var(--body);color:#111}
  #print h1{font-size:40px;margin:0 0 4px}
  #print .pday{break-inside:avoid-page;border-top:1px solid #111;padding-top:10px;margin-top:18px}
  #print .pday h2{margin:2px 0 6px}
  #print .pimgs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:8px 0}
  #print .pimgs img{width:100%;aspect-ratio:1;object-fit:cover}
  #print .cover{height:92vh;display:flex;flex-direction:column;justify-content:flex-end;break-after:page}
}
</style>
</head>
<body>
<div class="wrap">

<a class="brand" href="https://aspentraveladvisors.com" target="_blank" rel="noopener">

{id:"sanderling", n:"Sanderling", sci:"Calidris alba", g:"bird", st:"M", c:["white","grey","black"], z:"s", w:["shore"],

/* ============================================================
   STATE — localStorage for the small things, IndexedDB for photos.
   Keys start "sbg." so this book can share an origin with the others.
   ============================================================ */
const K = "sbg.";
const mem = {};
const store = {
  get(k){ try{ const v = localStorage.getItem(k); return v===null?mem[k]:v; }catch(e){ return mem[k]; } },
  set(k,v){ mem[k]=v; try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ delete mem[k]; try{ localStorage.removeItem(k); }catch(e){} }
};
const getJ = (k, d) => { try{ const v = store.get(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } };
const setJ = (k, v) => store.set(k, JSON.stringify(v));

const SPX = {}; SPECIES.forEach(s => SPX[s.id] = s);
const STATUS = {E:"Endemic", e:"Endemic race", N:"Native", M:"Visitor"};
const HOW = {dry:"Dry landing", wet:"Wet landing", panga:"Panga ride", snorkel:"Snorkel", kayak:"Kayak",
             walk:"On foot", coach:"By coach", ship:"From the deck", other:""};

let tab = store.get(K+"tab") || "day";
let curDay = store.get(K+"day") || null;          /* set properly once the clock is read */
const dayOf = id => DAYS.find(d => d.id === id);
const day = () => dayOf(curDay);
const dayIdx = id => DAYS.findIndex(d => d.id === id);

/* ============================================================
   HELPERS
   ============================================================ */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hhmm = m => { m = Math.max(0, Math.round(m)); const h = Math.floor(m/60), r = m%60;
  return h ? h + "h " + String(r).padStart(2,"0") + "m" : r + "m"; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const WD = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function fmtDate(iso, long){
  const [y,m,d] = iso.split("-").map(Number);
  const dt = new Date(Date.UTC(y,m-1,d));
  return (long ? WD[dt.getUTCDay()] + " " : "") + d + " " + MON[m-1];
}
let toastT = 0;
function toast(msg){
  let el = $("#toast");
  if(!el){ el = document.createElement("div"); el.id = "toast"; el.className = "toast";
           el.setAttribute("role","status"); document.body.appendChild(el); }
  el.textContent = msg; el.classList.remove("hidden");
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.add("hidden"), 3800);
}

/* ============================================================
   TIME — the book keeps ship time, whatever the phone thinks.
   A phone at sea often has no network to set its zone from, and some
   ships keep mainland time for convenience; both are handled here.
   ============================================================ */
const shipClock = () => store.get(K+"clock") === "mainland" ? "mainland" : "galapagos";
const tzFor = d => (d.tz === -6 && shipClock() === "mainland") ? -5 : d.tz;
function epochOf(d, t){
  if(!t) return null;
  const [y,m,dd] = d.date.split("-").map(Number), [h,mi] = t.split(":").map(Number);
  return Date.UTC(y,m-1,dd,h,mi) - tzFor(d)*3600e3;
}
function localParts(ms, tz){
  const x = new Date(ms + tz*3600e3);
  return {date: x.toISOString().slice(0,10), mins: x.getUTCHours()*60 + x.getUTCMinutes(),
          hm: String(x.getUTCHours()).padStart(2,"0") + ":" + String(x.getUTCMinutes()).padStart(2,"0")};
}
/* which day of the trip is it now: before → the first, after → the last */
function nowDay(){
  const t = Date.now();
  for(const d of DAYS) if(localParts(t, tzFor(d)).date === d.date) return {d, state:"on"};
  return Date.now() < epochOf(DAYS[0], "00:00") ? {d:DAYS[0], state:"before"} : {d:DAYS[DAYS.length-1], state:"after"};
}

/* Alongside every hand-set time we keep the printed time it was typed over,
   so a change in the itinerary is not hidden under an old edit. */
const actKey = (d, a, i) => K + "t." + d.id + "." + i + "." + a.s;
function planned(d){
  const o = getJ(K+"plan."+d.id, null);
  const base = JSON.stringify(d.acts);
  if(o && o.base === base) return o.acts;
  if(o) store.del(K+"plan."+d.id);                 /* the printed day changed under it */
  return d.acts;
}
function acts(d){
  return planned(d).map((a, i) => {
    const k = actKey(d, a, i), out = Object.assign({}, a, {i});
    ["t","e"].forEach(w => {
      const v = store.get(k+"."+w);
      if(v == null) return;
      if(store.get(k+"."+w+".base") !== (a[w] || "")){ store.del(k+"."+w); store.del(k+"."+w+".base"); return; }
      out[w] = v; out.edited = true;
    });
    return out;
  });
}
function setActTime(d, i, w, v){
  const a = planned(d)[i]; if(!a) return;
  const k = actKey(d, a, i);
  store.set(k+"."+w, v); store.set(k+"."+w+".base", a[w] || "");
}
const siteOf = a => SITES[a.s] || null;
const isLanding = a => a.how !== "other" && a.s !== "baltra";

/* which species each day offers — from the plan as it now stands */
function buildWhere(){
  const W = {};
  DAYS.forEach((d, di) => {
    const seenHere = {};
    acts(d).forEach(a => {
      const st = siteOf(a); if(!st || !isLanding(a)) return;
      (st.see || []).forEach(id => {
        const key = id + "|" + a.s; if(seenHere[key]) return; seenHere[key] = 1;
        (W[id] = W[id] || []).push({di, day:d.id, site:a.s});
      });
    });
  });
  return W;
}
const routeSpecies = W => SPECIES.filter(s => W[s.id]);

/* ============================================================
   SIGHTINGS
   ============================================================ */
const seenMap = () => getJ(K+"seen", {});
const isSeen = id => !!seenMap()[id];
function addSighting(id, s){
  const m = seenMap(), cur = m[id];
  if(!cur) m[id] = {t:s.t, day:s.day, site:s.site || null, n:1, photos:s.photo ? [s.photo] : []};
  else{
    cur.n = (cur.n || 1) + 1;
    if(s.photo && cur.photos.indexOf(s.photo) < 0) cur.photos.push(s.photo);
    if(s.t < cur.t){ cur.t = s.t; cur.day = s.day; cur.site = s.site || null; }
  }
  setJ(K+"seen", m);
}
function dropSighting(id, photo){
  const m = seenMap(), cur = m[id]; if(!cur) return;
  if(photo){
    cur.photos = cur.photos.filter(p => p !== photo);
    cur.n = Math.max(0, (cur.n || 1) - 1);
    if(cur.n > 0){ setJ(K+"seen", m); return; }
  }
  delete m[id]; setJ(K+"seen", m);
}
/* a tick without a photo: file it where you most likely are */
function tickNow(id){
  const nd = nowDay(), W = buildWhere();
  let dd = nd.state === "on" ? nd.d : day(), site = null;
  const live = liveAct(dd);
  if(live && siteOf(live.a) && (siteOf(live.a).see || []).indexOf(id) > -1) site = live.a.s;
  if(!site){ const w = (W[id] || []).find(x => x.day === dd.id); if(w) site = w.site; }
  if(!site && nd.state !== "on"){
    const w = (W[id] || []).find(x => x.day === curDay); if(w){ dd = dayOf(w.day); site = w.site; }
  }
  addSighting(id, {t:Date.now(), day:dd.id, site});
}
function toggleSeen(id){
  if(isSeen(id)){
    const s = seenMap()[id];
    if(s.photos && s.photos.length && !confirm("Remove " + SPX[id].n + " from your log? Its photos stay in the Camera tab.")) return;
    dropSighting(id);
    toast(SPX[id].n + " removed from the log.");
  } else {
    tickNow(id);
    const s = seenMap()[id];
    toast(SPX[id].n + " logged" + (s.site && SITES[s.site] ? " · " + SITES[s.site].n : "") + ".");
  }
}

/* ============================================================
   NOW — the countdown. Live landing: time to the panga. Between:
   time to the next. Same bar as every Shore Book; different boat.
   ============================================================ */
function liveAct(d){
  const t = Date.now(), list = acts(d);
  for(const a of list){
    const s = epochOf(d, a.t), e = epochOf(d, a.e);
    if(s && e && t >= s && t < e) return {a, s, e};
  }
  return null;
}
function nextAct(d){
  const t = Date.now();
  return acts(d).map(a => ({a, s:epochOf(d, a.t) || epochOf(d, a.e)})).filter(x => x.s && x.s > t)
    .sort((x,y) => x.s - y.s)[0] || null;
}
const warned = {};
function renderTide(){
  const nd = nowDay(), d = nd.d, t = Date.now();
  let label = "", clock = "—", what = "", fill = 0, warn = false, foot = "";
  if(nd.state === "before"){
    const ms = epochOf(DAYS[0], "15:00") - t, days = Math.ceil(ms / 864e5);
    label = "The expedition begins in";
    clock = days > 1 ? days + " days" : hhmm(ms/6e4);
    what = "Quito, " + fmtDate(DAYS[0].date, true) + ". Then Baltra on " + fmtDate(DAYS[2].date) + ".";
  } else if(nd.state === "after"){
    label = "Home"; clock = "✓";
    what = "The journal is ready to keep. Journal → Save as PDF.";
    fill = 100;
  } else {
    const live = liveAct(d);
    if(live){
      const left = (live.e - t)/6e4;
      const ship = live.a.how === "coach" || live.a.how === "walk" ? "Back by" : live.a.how === "ship" ? "Ship in the channel for" : "Back to the panga in";
      label = d.tz === -5 ? "Ends in" : ship;
      clock = hhmm(left); warn = left <= 15;
      what = live.a.w;
      fill = Math.min(100, Math.max(0, (t - live.s) / (live.e - live.s) * 100));
      foot = timeInputs(d, live.a, live.a.how === "coach" ? "Back" : live.a.how === "ship" ? "Ends" : "Panga back");
      if(live.a.how !== "ship") panga(live, left);
    } else {
      const nx = nextAct(d);
      if(nx){
        const list = acts(d), prev = list.map(a => epochOf(d, a.e)).filter(e => e && e <= t).sort((a,b)=>b-a)[0];
        label = "Next in"; clock = hhmm((nx.s - t)/6e4);
        what = nx.a.w + (nx.a.t ? " · " + nx.a.t : "");
        if(prev) fill = Math.min(100, (t - prev) / (nx.s - prev) * 100);
        foot = timeInputs(d, nx.a, "Ends");
      } else {
        const tm = DAYS[dayIdx(d.id)+1];
        label = "Done for today"; clock = "—";
        what = tm ? "Tomorrow: " + tm.n + (acts(tm)[0] && acts(tm)[0].t ? " · first out " + acts(tm)[0].t : "") : "";
        fill = 100;
      }
    }
  }
  $("#tideLabel").textContent = label;
  const c = $("#tideClock"); c.textContent = clock; c.classList.toggle("warn", warn);
  $("#tideWhat").textContent = what;
  $("#tideFill").style.width = fill + "%";
  const f = $("#tideFoot");
  if(f.dataset.html !== foot && !f.contains(document.activeElement)){ f.innerHTML = foot; f.dataset.html = foot; }
}
function timeInputs(d, a, endLabel){
  if(!a.t && !a.e) return "";
  return '<label>' + (a.how === "snorkel" ? "In the water" : a.how === "ship" ? "On deck" : "Ashore") + ' <input type="time" step="300" data-tday="' + d.id + '" data-ti="' + a.i + '" data-tw="t" value="' + esc(a.t || "") + '"></label>' +
         '<label>' + endLabel + ' <input type="time" step="300" data-tday="' + d.id + '" data-ti="' + a.i + '" data-tw="e" value="' + esc(a.e || "") + '"></label>';
}
/* fifteen and five minutes before the panga leaves: a tap and, if asked for, a tone */
function panga(live, left){
  const key = live.a.s + live.e;
  [15, 5].forEach(m => {
    if(left <= m && left > m - 1.5 && !warned[key+m] && document.visibilityState === "visible"){
      warned[key+m] = 1;
      signal();
      toast(m + " minutes to the panga.");
    }
  });
}

/* --- the only tap an iPhone gives a web page: the native switch's haptic.
   Undocumented, a bonus, never the plan — hence the toast. ------------------ */
let swEl = null;
function tapSwitch(n){
  try{ if(!("switch" in document.createElement("input"))) return; }catch(e){ return; }
  if(!swEl || !swEl.isConnected){
    const l = document.createElement("span"); l.className = "haptic-switch"; l.setAttribute("aria-hidden","true");
    swEl = document.createElement("input"); swEl.type = "checkbox"; swEl.tabIndex = -1;
    try{ swEl.setAttribute("switch",""); }catch(e){}
    l.appendChild(swEl); document.body.appendChild(l);
  }
  for(let i = 0; i < n; i++) setTimeout(() => { try{ swEl.click(); }catch(e){} }, i*220);
}
let actx = null;
function chime(){
  if(store.get(K+"sound") !== "1") return;
  const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
  try{ actx = actx || new AC(); }catch(e){ return; }
  const c = actx; if(c.state === "suspended"){ try{ c.resume(); }catch(e){} }
  [0, .28].forEach((o, i) => {
    const osc = c.createOscillator(), g = c.createGain(), t = c.currentTime + .02 + o;
    osc.type = "sine"; osc.frequency.value = i ? 659.25 : 523.25;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.2, t+.012);
    g.gain.exponentialRampToValueAtTime(.0001, t+.24);
    osc.connect(g); g.connect(c.destination); osc.start(t); osc.stop(t+.3);
  });
}
function signal(){
  try{ if(navigator.vibrate && navigator.vibrate([200,100,200])) { chime(); return; } }catch(e){}
  tapSwitch(2); chime();
}

/* ============================================================
   HEAD & RAIL
   ============================================================ */
function renderHead(){
  const d = day(), nd = nowDay();
  $("#dayName").textContent = d.n;
  $("#daySub").textContent = fmtDate(d.date, true) + " · " + d.sub;
  $("#kick").textContent = "Shore Book · Day " + (dayIdx(d.id)+1) + " of " + DAYS.length;
  $("#today").textContent = nd.state === "on" ? "Ship time " + localParts(Date.now(), tzFor(nd.d)).hm
    : nd.state === "before" ? "Departs " + fmtDate(DAYS[0].date) : "Home";
}
function renderRail(){
  const nd = nowDay();
  $("#dayRail").innerHTML = DAYS.map((d, i) =>
    '<button class="port-btn' + (nd.state === "on" && nd.d.id === d.id ? " now" : "") + '" role="tab" data-day="' + d.id +
    '" aria-selected="' + (d.id === curDay) + '">D' + (i+1) + '<small>' + esc(fmtDate(d.date)) + '</small></button>').join("");
  const sel = $('#dayRail [aria-selected="true"]');
  if(sel) sel.scrollIntoView({block:"nearest", inline:"center"});
}
function renderNet(){
  const on = navigator.onLine !== false, code = !!store.get(K+"code");
  const n = $("#net"); n.classList.toggle("on", on);
  n.querySelector("span").textContent = on ? (code ? "Signal · AI on" : "Signal") : "No signal";
  const q = PH.filter(p => p.status === "queued").length;
  const t = document.querySelector('.tab[data-tab="cam"]');
  if(t) t.innerHTML = "Camera" + (q ? '<span class="badge">' + q + '</span>' : "");
}

/* ============================================================
   DAY — the morning briefing, assembled from the book. It is not
   generated, so it is there at 6 a.m. with no signal.
   ============================================================ */
function bestChances(d, W, max){
  const di = dayIdx(d.id), here = {};
  acts(d).forEach(a => { const s = siteOf(a); if(s && isLanding(a)) (s.see || []).forEach(id => here[id] = a.s); });
  return Object.keys(here).filter(id => !isSeen(id) && SPX[id]).map(id => {
    const later = (W[id] || []).filter(w => w.di > di).length;
    const earlier = (W[id] || []).filter(w => w.di < di).length;
    return {id, site:here[id], only: !later && !earlier, last: !later && earlier > 0,
            score:(SPX[id].k ? 4 : 0) + (SPX[id].st === "E" ? 2 : 0) + (!later ? 3 : 0)};
  }).sort((a,b) => b.score - a.score || SPX[a.id].n.localeCompare(SPX[b.id].n)).slice(0, max || 8);
}
function briefing(d, W){
  const list = acts(d), lands = list.filter(a => isLanding(a) && siteOf(a));
  const ship = d.tz === -6;
  let html = '<section class="brief"><p class="kick">' + (ship ? "Before breakfast" : "Today") + '</p>';
  if(lands.length){
    const kinds = {}; lands.forEach(a => kinds[a.how] = (kinds[a.how] || 0) + 1);
    const words = ["", "one", "two", "three", "four"];
    const parts = [];
    const nl = (kinds.wet || 0) + (kinds.dry || 0);
    if(nl) parts.push(kinds.wet && kinds.dry ? words[nl] + " landings, " + words[kinds.wet] + " wet and " + words[kinds.dry] + " dry"
      : words[nl] + (kinds.wet ? " wet" : " dry") + " landing" + (nl > 1 ? "s" : ""));
    if(kinds.panga) parts.push("a panga ride");
    if(kinds.snorkel) parts.push("a snorkel");
    if(kinds.coach) parts.push("a drive into the highlands");
    if(kinds.walk && ship) parts.push("time in town");
    if(kinds.ship) parts.push("whale water from the deck");
    if(parts.length){
      const s = parts.length > 1 ? parts.slice(0,-1).join(", ") + " and " + parts[parts.length-1] : parts[0];
      html += '<p>' + esc(s.charAt(0).toUpperCase() + s.slice(1)) + '.</p>';
    }
    const bring = [], seenHow = {};
    lands.forEach(a => { if(BRING[a.how] && !seenHow[a.how]){ seenHow[a.how] = 1; bring.push(BRING[a.how]); } });
    if(ship) bring.push(BRING.every);
    const sn = lands.filter(a => a.how === "snorkel" && siteOf(a).water);
    if(sn.length) bring.push("Water at " + sn.map(a => siteOf(a).n + ": " + siteOf(a).water.toLowerCase()).join("; ") + ".");
    html += '<ul>' + bring.map(b => '<li>' + esc(b) + '</li>').join("") + '</ul>';
  }
  list.filter(a => a.flag).forEach(a => {
    html += '<p class="x" style="color:var(--rosso);font-size:13px">' + esc(a.w) + ': ' + esc(a.flag) + '.</p>';
  });
  const bc = bestChances(d, W, 8);
  if(bc.length){
    html += '<p style="margin-top:10px"><b>Still missing, and here today</b></p><div class="chips">' +
      bc.map(b => '<button class="chip' + (SPX[b.id].k ? " k" : "") + '" data-sp="' + b.id + '">' + esc(SPX[b.id].n) +
        (b.only ? ' <span class="today-tag">only here</span>' : b.last ? ' <span class="today-tag">last chance</span>' : '') + '</button>').join("") + '</div>';
  }
  return html + '</section>';
}
function renderDay(){
  const d = day(), W = buildWhere(), list = acts(d), nd = nowDay();
  const live = nd.state === "on" && nd.d.id === d.id ? liveAct(d) : null;
  const t = Date.now();
  let html = '<div class="dock"><b>' + esc(d.dock.t) + '</b><span>' + esc(d.dock.d) + '</span></div>';
  html += briefing(d, W);

  const ov = getJ(K+"plan."+d.id, null);
  if(ov && ov.base === JSON.stringify(d.acts)){
    html += '<div class="dock warn"><b>Changed at the briefing</b><span>' + esc(ov.summary || "The plan below is the revised one.") +
      ' <button class="more" data-unplan="' + d.id + '">Restore the printed plan</button></span></div>';
  }

  html += '<h3>The day</h3><ol class="rail">';
  list.forEach((a, n) => {
    const st = siteOf(a), e = epochOf(d, a.e);
    const cls = live && live.a.i === a.i ? " live" : (e && e < t ? " past" : "");
    html += '<li class="stop' + cls + '"><span class="dot">' + (n+1) + '</span>';
    html += '<div class="stop-time">' + (a.t || a.e ? '<input type="time" step="300" class="tin" data-tday="' + d.id + '" data-ti="' + a.i + '" data-tw="t" value="' + esc(a.t || "") + '" aria-label="Start"> – ' +
            '<input type="time" step="300" class="tin" data-tday="' + d.id + '" data-ti="' + a.i + '" data-tw="e" value="' + esc(a.e || "") + '" aria-label="End">' : "Time from the ship") +
            (a.p ? "" : ' · <span title="Not printed by HX">typical</span>') + (a.edited ? " · edited" : "") + '</div>';
    html += '<div class="stop-name">' + esc(a.w) + (st && st.isl ? '<small>' + esc(st.isl) + '</small>' : '') + '</div>';
    if(HOW[a.how]) html += '<span class="how ' + a.how + '">' + HOW[a.how] + '</span>';
    if(st && st.diff && isLanding(a)) html += '<span class="how" style="color:var(--mute)">' + esc(st.diff) + '</span>';
    if(a.flag) html += '<span class="how flag">Unconfirmed</span>';
    const first = list.findIndex(b => b.s === a.s) === n;
    if(st && first && a.s !== "baltra"){
      html += '<p>' + esc(st.d) + '</p>';
      if(st.l) html += '<p class="look">' + esc(st.l) + '</p>';
      if(st.x) html += '<p class="x">' + esc(st.x) + '</p>';
      if(st.see && st.see.length){
        const ids = st.see.filter(id => SPX[id]).sort((x,y) => (SPX[y].k?1:0) - (SPX[x].k?1:0));
        html += '<div class="chips">' + ids.slice(0, 12).map(id => '<button class="chip' + (isSeen(id) ? " seen" : "") + '" data-sp="' + id + '">' + esc(SPX[id].n) + '</button>').join("") +
          (ids.length > 12 ? '<button class="chip" data-wsite="' + a.s + '">+' + (ids.length - 12) + ' more</button>' : '') + '</div>';
      }
    }
    if(a.note) html += '<p class="x">' + esc(a.note) + '</p>';
    html += '</li>';
  });
  html += '</ol>';

  /* the two days ashore get the old Shore Book treatment */
  list.map(a => SITES[a.s]).filter((s, i, arr) => s && arr.indexOf(s) === i).forEach(st => {
    if(st.walk && d.id === "d2"){
      html += '<h3>What the day covers</h3>' + st.walk.map(w =>
        '<article class="card"><h4>' + esc(w.n) + '</h4><p>' + esc(w.w) + '</p>' +
        (w.l ? '<p class="look" style="border-left:2px solid var(--olio);padding-left:10px">' + esc(w.l) + '</p>' : '') +
        (w.x ? '<p class="x">' + esc(w.x) + '</p>' : '') + '</article>').join("");
    }
    if(st.eat && (d.id !== "d2" || st !== SITES.quito)){
      html += '<h3>Eat</h3>' + st.eat.map(e => '<article class="card"><div class="t">' + esc(e.t) + '</div><h4>' + esc(e.n) + '</h4><p>' + esc(e.d) + '</p></article>').join("");
    }
    if(st.buy) html += '<h3>Buy</h3>' + st.buy.map(b => '<article class="card"><h4>' + esc(b.n) + '</h4><p>' + esc(b.d) + '</p></article>').join("");
  });

  if(d.screen){
    html += '<h3>Watch tonight</h3><article class="card"><div class="t">' + esc(d.screen.y) + '</div><h4>' + esc(d.screen.f) + '</h4><p>' + esc(d.screen.d) + '</p></article>';
  }

  /* tonight's briefing rewrites tomorrow */
  const tm = DAYS[dayIdx(d.id)+1];
  if(tm && tm.tz === -6 && d.id !== "d1"){
    const draft = store.get(K+"brief."+tm.id) || "";
    const res = getJ(K+"briefres."+tm.id, null);
    html += '<h3>Tonight\'s briefing</h3>' +
      '<p class="note">Each evening the expedition leader sets out tomorrow — and on an expedition, tomorrow moves. Type the gist, or tap the microphone on the keyboard and dictate while they talk. The book will work out what changed for ' +
      esc(fmtDate(tm.date)) + ' and keep what the naturalists told you for the journal.</p>' +
      '<textarea id="briefTxt" data-brief="' + tm.id + '" placeholder="“Wake-up 6:15. Wet landing at Punta Pitt instead of… snorkel at 10…”">' + esc(draft) + '</textarea>' +
      '<div class="btnrow"><button class="btn" data-readbrief="' + tm.id + '">Read it</button></div>';
    if(res) html += briefResult(tm, res);
  }
  $("#panel").innerHTML = html;
}
function briefResult(tm, r){
  let h = '<div class="card hi"><div class="t">What changed for ' + esc(fmtDate(tm.date)) + '</div><p>' + esc(r.summary) + '</p>';
  if(r.changes && r.changes.length){
    h += '<ul style="font-size:14px;padding-left:18px;margin:8px 0">' + r.changes.map(c => '<li><b>' + esc(c.action) + '</b> ' + esc(c.site_name || (SITES[c.site] && SITES[c.site].n) || "") +
      (c.start || c.end ? ' · ' + esc(c.start) + (c.end ? '–' + esc(c.end) : '') : '') + (c.how ? ' · ' + esc(c.how) : '') + (c.note ? ' — ' + esc(c.note) : '') + '</li>').join("") + '</ul>';
    if(!r.applied) h += '<div class="btnrow"><button class="btn" data-applybrief="' + tm.id + '">Apply to ' + esc(fmtDate(tm.date)) + '</button><button class="btn ghost" data-dropbrief="' + tm.id + '">Ignore</button></div>';
    else h += '<p class="x">Applied. Times can still be edited by hand.</p>';
  }
  if(r.learned && r.learned.length) h += '<p class="x" style="margin-top:8px">' + r.learned.length + ' note' + (r.learned.length > 1 ? 's' : '') + ' from the naturalists saved to today\'s journal.</p>';
  return h + '</div>';
}
function applyBrief(tm, r){
  let list = planned(tm).map(a => Object.assign({}, a));
  (r.changes || []).forEach(c => {
    const sid = SITES[c.site] ? c.site : null;
    const how = c.how || (sid ? SITES[sid].how : "other");
    const label = sid ? SITES[sid].n : (c.site_name || "New stop");
    if(c.action === "replace"){
      const ix = list.findIndex(a => a.s === c.replaces);
      const na = {s:sid || "other_" + uid(), t:c.start || (ix > -1 ? list[ix].t : ""), e:c.end || (ix > -1 ? list[ix].e : ""), how, w:label, note:c.note, p:0, brief:1};
      if(ix > -1) list.splice(ix, 1, na); else list.push(na);
    } else if(c.action === "add"){
      list.push({s:sid || "other_" + uid(), t:c.start, e:c.end, how, w:label, note:c.note, p:0, brief:1});
    } else if(c.action === "remove"){
      list = list.filter(a => a.s !== c.site);
    } else if(c.action === "retime" || c.action === "note"){
      list.forEach(a => { if(a.s === c.site){ if(c.start) a.t = c.start; if(c.end) a.e = c.end; if(c.note) a.note = c.note; } });
    }
  });
  list.sort((a,b) => (a.t || a.e || "99").localeCompare(b.t || b.e || "99"));
  setJ(K+"plan."+tm.id, {base:JSON.stringify(tm.acts), acts:list, summary:r.summary});
  r.applied = true; setJ(K+"briefres."+tm.id, r);
}

/* ============================================================
   WILDLIFE — the field key. Works with no signal: tell it what you
   saw and it narrows the list, ranked by where you are standing.
   ============================================================ */
const wk = {q:"", scope:null, g:"", c:[], z:"", w:"", site:""};
const COLOURS = {black:"#1a1a1a", white:"#fff", grey:"#9aa0a3", brown:"#7a5a3a", blue:"#2C7AA3", red:"#c0392b",
  yellow:"#e1b92b", orange:"#e07b2a", green:"#4C6A3A", pink:"#e79bb2", spotted:"repeating-radial-gradient(#1a1a1a 0 2px,#fff 2px 4px)"};
function renderWild(){
  const W = buildWhere(), d = day(), here = {};
  acts(d).forEach(a => { const s = siteOf(a); if(s && isLanding(a)) (s.see || []).forEach(id => here[id] = a.s); });
  const hasHere = Object.keys(here).length > 0;
  if(wk.scope == null) wk.scope = hasHere ? "today" : "route";
  let pool = SPECIES.filter(s => W[s.id]);
  if(wk.site) pool = pool.filter(s => (SITES[wk.site].see || []).indexOf(s.id) > -1);
  else if(wk.scope === "today" && hasHere) pool = pool.filter(s => here[s.id]);
  if(wk.g) pool = pool.filter(s => s.g === wk.g);
  wk.c.forEach(c => pool = pool.filter(s => s.c.indexOf(c) > -1));
  if(wk.z) pool = pool.filter(s => s.z === wk.z);
  if(wk.w) pool = pool.filter(s => s.w.indexOf(wk.w) > -1);
  if(wk.q){
    const q = wk.q.toLowerCase();
    pool = SPECIES.filter(s => (s.n + " " + s.sci + " " + s.look).toLowerCase().indexOf(q) > -1);
  }
  const di = dayIdx(curDay);
  pool.sort((a,b) => (here[b.id]?1:0) - (here[a.id]?1:0) || (b.k?1:0) - (a.k?1:0) || a.n.localeCompare(b.n));

  const chip = (attr, v, on, label, extra) => '<button class="chip' + (on ? " on" : "") + '" ' + attr + '="' + v + '">' + (extra || "") + esc(label) + '</button>';
  let html = '<input class="search" type="search" id="wq" placeholder="Search: booby, iguana, red feet…" value="' + esc(wk.q) + '" autocomplete="off">';
  if(wk.site){
    html += '<div class="toggle">At ' + esc(SITES[wk.site].n) + ' · <button class="more" data-wsite="">Show all</button></div>';
  } else {
    html += '<div class="chips" style="margin-top:10px">' + (hasHere ? chip("data-wscope", "today", wk.scope === "today", "Here on " + fmtDate(d.date)) : "") +
      chip("data-wscope", "route", wk.scope !== "today" || !hasHere, "Whole route") + '</div>';
  }
  html += '<div class="keyrow"><span class="lab">What is it</span><div class="chips">' + chip("data-wg", "", !wk.g, "All") +
    Object.keys(GROUPS).map(g => chip("data-wg", g, wk.g === g, GROUPS[g])).join("") + '</div></div>';
  html += '<div class="keyrow"><span class="lab">Colours you saw</span><div class="chips">' +
    Object.keys(COLOURS).map(c => chip("data-wc", c, wk.c.indexOf(c) > -1, c, '<span class="sw" style="background:' + COLOURS[c] + '"></span>')).join("") + '</div></div>';
  html += '<div class="keyrow"><span class="lab">Size · where</span><div class="chips">' +
    [["s","Small"],["m","Medium"],["l","Large"]].map(z => chip("data-wz", z[0], wk.z === z[0], z[1])).join("") +
    [["sea","In the water"],["shore","On the shore"],["land","Inland"],["air","Flying"]].map(w => chip("data-ww", w[0], wk.w === w[0], w[1])).join("") + '</div></div>';
  html += '<p class="note" style="margin-top:12px">' + pool.length + (pool.length === 1 ? " match" : " matches") +
    (wk.c.length || wk.z || wk.w || wk.g ? ' · <button class="more" data-wclear="1">Clear the key</button>' : '') + '</p>';
  html += '<div>' + pool.map(s => spRow(s, W, di, here)).join("") + '</div>';
  if(!pool.length) html += '<p class="note">Nothing in the book matches all of that. Take off a colour — light at sea plays tricks — or photograph it and ask on the Camera tab.</p>';
  $("#panel").innerHTML = html;
}
function spRow(s, W, di, here){
  const sn = seenMap()[s.id];
  let meta = "";
  if(sn) meta = "Seen " + (dayOf(sn.day) ? "Day " + (dayIdx(sn.day)+1) : "") + (sn.site && SITES[sn.site] ? " · " + SITES[sn.site].n : "");
  else if(here && here[s.id] && SITES[here[s.id]]) meta = '<span class="today-tag">Today</span> · ' + esc(SITES[here[s.id]].n);
  else {

  return '<div class="sp" data-sp="' + s.id + '"><button class="sp-mark' + (sn ? " on" : "") + '" data-seen="' + s.id + '" aria-label="Seen">' + (sn ? "✓" : "") + '</button>' +
    refImg(s.id, "sp-img") + '<div class="sp-body"><div class="sp-n">' + esc(s.n) + '<span class="st ' + s.st + '">' + STATUS[s.st] + '</span></div>' +
    '<div class="sp-s">' + esc(s.sci) + '</div><div class="sp-m">' + (sn ? esc(meta) : meta) + '</div></div></div>';

/* ---------- ask: shared by the species sheet and the photo card ---------- */
const answers = {};
function askBox(key, ph){
  const a = answers[key];
  return '<h3>Ask the book</h3><div style="display:flex;gap:8px"><input class="field" data-askin="' + esc(key) + '" placeholder="' + esc(ph) + '"><button class="btn" data-ask="' + esc(key) + '">Ask</button></div>' +
    (a ? '<div class="card" style="margin-top:10px">' + (a.wait ? '<p class="x">Thinking…</p>' : a.err ? '<p class="x">' + esc(a.err) + '</p>' :
      '<p class="t">' + esc(a.q) + '</p><p>' + esc(a.answer) + '</p>' +
      (a.seen || a.inferred ? '<div class="split">' + (a.seen ? '<div><b>In the photo</b>' + esc(a.seen) + '</div>' : '<div></div>') +
        (a.inferred ? '<div class="inf"><b>Interpretation</b>' + esc(a.inferred) + '</div>' : '') + '</div>' : '')) + '</div>' : '') +
    '<p class="note" style="margin-top:6px">Needs signal. Answers come from Claude, told where you are and what the book knows.</p>';
}
async function ask(key, q){
  if(!q) return;
  answers[key] = {wait:true, q};
  repaintAsk(key);
  const body = {question:q, ctx:{}};
  const nd = nowDay(), live = nd.state === "on" ? liveAct(nd.d) : null;
  body.ctx.when = fmtDate(nd.d.date, true);
  body.ctx.site = live && siteOf(live.a) ? siteOf(live.a).n : "";
  if(key.startsWith("sp:")) body.ctx.species = SPX[key.slice(3)].n + " (" + SPX[key.slice(3)].sci + ")";
  if(key.startsWith("ph:")){
    const p = PH.find(x => x.id === key.slice(3));
    if(p){
      body.image = await b64(p);
      body.ctx.site = SITES[p.site] ? SITES[p.site].n : p.act;
      body.ctx.when = whenText(p);
      if(p.species && SPX[p.species]) body.ctx.species = SPX[p.species].n;
    }
  }
  try{
    const r = await ai("ask", body);
    answers[key] = Object.assign({q}, r);
  }catch(e){ answers[key] = {q, err:errText(e)}; }
  repaintAsk(key);
}
function repaintAsk(key){
  if(key.startsWith("sp:") && $("#sheet")) openSpecies(key.slice(3));
  else if(key.startsWith("ph:")) render();
}
function errText(e){
  if(e && e.kind === "nocode") return "Photo ID and questions need the trip code — Know → Settings.";
  if(e && e.kind === "net") return "No signal. Try again when the ship's Wi-Fi is back.";
  return (e && e.msg) || "That did not work. Try again.";
}

/* ============================================================
   AI — one small server function that holds the key. Everything
   the phone sends is in the body below: a downscaled photo and the
   context. Nothing else leaves the phone.
   ============================================================ */
let CATALOGUE = null;
function catalogue(){
  if(CATALOGUE) return CATALOGUE;
  const W = buildWhere();
  CATALOGUE = SPECIES.map(s => s.id + " | " + s.n + " (" + s.sci + ") | " + GROUPS[s.g] + " | " + STATUS[s.st] +
    " | " + s.look + (s.tip ? " Tell apart: " + s.tip : "") +
    " | sites: " + (W[s.id] || []).map(w => SITES[w.site].n).filter((v,i,a) => a.indexOf(v) === i).join(", ")).join("\n");
  return CATALOGUE;
}
async function ai(task, body){
  const code = store.get(K+"code");
  if(!code) throw {kind:"nocode"};
  if(navigator.onLine === false) throw {kind:"net"};
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 110000);
  let res, j = null;
  try{
    res = await fetch("api/claude", {method:"POST", signal:ctl.signal,
      headers:{"content-type":"application/json", "x-book-code":code},
      body:JSON.stringify(Object.assign({task, ref:catalogue()}, body))});
  }catch(e){ throw {kind:"net"}; }
  finally{ clearTimeout(tm); }
  try{ j = await res.json(); }catch(e){}
  if(!res.ok || !j || !j.ok){
    const retry = res.status === 429 || res.status >= 500;
    throw {kind:retry ? "retry" : "fail", status:res.status,
           msg:(j && j.error) || (res.status === 404 ? "This copy of the book has no AI server behind it." : "Error " + res.status)};
  }
  return j.data;
}

/* ============================================================
   REFERENCE PHOTOS — one picture per species from Wikimedia Commons.

   a named Wikipedia article (alternates after "|"), never a search, so
   the wrong animal cannot turn up. Only openly licensed files are kept,
   and every one is credited on its species page and under Know.
   ============================================================ */
const WIKI = {

  magfrig:"Magnificent frigatebird", greatfrig:"Great frigatebird", penguin:"Galápagos penguin",

  tropicbird:"Red-billed tropicbird", stormpetrel:"Wedge-rumped storm petrel|Band-rumped storm petrel",
  noddy:"Brown noddy", shearwater:"Galápagos shearwater", pelican:"Brown pelican",
  flamingo:"American flamingo", pintail:"White-cheeked pintail", stilt:"Black-necked stilt",
  oystercatcher:"American oystercatcher", lavaheron:"Lava heron", ycnheron:"Yellow-crowned night heron",
  gbheron:"Great blue heron", owl:"Short-eared owl", hawk:"Galápagos hawk", dove:"Galápagos dove",
  mockingbird:"Galápagos mockingbird", floreanamock:"Floreana mockingbird", flycatcher:"Galápagos flycatcher",
  vermilion:"Little vermilion flycatcher|Brujo flycatcher", yellowwarbler:"Yellow warbler|American yellow warbler",
  groundfinch:"Medium ground finch|Small ground finch", cactusfinch:"Common cactus finch|Genovesa cactus finch",
  warblerfinch:"Green warbler-finch|Warbler-finch", woodpeckerfinch:"Woodpecker finch",
  marineiguana:"Marine iguana", landiguana:"Galápagos land iguana", tortoise:"Galápagos tortoise",
  lavalizard:"Galápagos lava lizard|Microlophus", racer:"Pseudalsophis|Galápagos racer",
  greenturtle:"Green sea turtle", sealion:"Galápagos sea lion", furseal:"Galápagos fur seal",
  bottlenose:"Common bottlenose dolphin", commondolphin:"Common dolphin|Short-beaked common dolphin",
  brydes:"Bryde's whale", sperm:"Sperm whale", orca:"Orca|Killer whale", humpback:"Humpback whale",
  turnstone:"Ruddy turnstone", whimbrel:"Whimbrel", plover:"Semipalmated plover", tattler:"Wandering tattler",
  sanderling:"Sanderling", blacktip:"Blacktip shark", barberfish:"Johnrandallia nigrirostris|Barberfish",
  saltbush:"Cryptocarpus pyriformis|Cryptocarpus", whitetip:"Whitetip reef shark", hammerhead:"Scalloped hammerhead",
  goldenray:"Rhinoptera steindachneri|Cownose ray", eagleray:"Spotted eagle ray|Aetobatus laticeps",
  stingray:"Diamond stingray", mola:"Ocean sunfish", kingangel:"King angelfish",
  surgeon:"Prionurus laticlavius|Prionurus", parrotfish:"Scarus ghobban", moorish:"Moorish idol",
  puffer:"Guineafowl puffer", sergeant:"Abudefduf troschelii", sallylightfoot:"Grapsus grapsus",
  pencilurchin:"Eucidaris galapagensis|Eucidaris", chocchip:"Nidorellia armata", opuntia:"Opuntia echios|Opuntia galapageia",
  candelabra:"Jasminocereus|Jasminocereus thouarsii", lavacactus:"Brachycereus|Brachycereus nesioticus",
  palosanto:"Bursera graveolens", scalesia:"Scalesia pedunculata|Scalesia", mangrove:"Rhizophora mangle",
  tiquilia:"Tiquilia nesiotica|Tiquilia"
};
const OPEN_LICENCE = /^(cc0|cc[ -]by(-sa)?( |$|-)|public domain|pd)/i;
const REF = {meta:getJ(K+"refs", {}), url:{}, busy:false};
const WAPI = "https://en.wikipedia.org/w/api.php?format=json&formatversion=2&origin=*&action=query";

async function loadRefs(){
  try{
    ((await idb.refs()) || []).forEach(r => { if(r.blob && REF.meta[r.id]) REF.url[r.id] = URL.createObjectURL(r.blob); });
  }catch(e){}
}
function refImg(id, cls){
  if(REF.url[id]) return '<img class="' + cls + '" src="' + REF.url[id] + '" alt="" loading="lazy">';
  const s = SPX[id];
  return '<span class="' + cls + '" aria-hidden="true">' + (s ? esc(s.n.charAt(0)) : "") + '</span>';
}
function refHero(id){
  const m = REF.meta[id];
  if(!REF.url[id] || !m) return "";
  return '<img class="hero" src="' + REF.url[id] + '" alt="' + esc(SPX[id].n) + '">' +
    '<p class="credit">Photo: ' + esc(m.artist || "Unknown") + ' · <a href="' + esc(m.src) + '" target="_blank" rel="noopener">' + esc(m.lic) + ', Wikimedia Commons</a></p>';
}
/* Commons writes the artist as HTML; read it as text without ever running it */
const plain = html => { try{ return (new DOMParser().parseFromString(String(html || ""), "text/html").body.textContent || "").replace(/\s+/g, " ").trim().slice(0, 120); }catch(e){ return ""; } };
async function wget(params){
  const r = await fetch(WAPI + params);
  if(!r.ok) throw new Error("wiki " + r.status);
  return r.json();
}
/* follow the API's own renames so an answer can be matched to what was asked */
function finalTitle(q, t){
  let x = t;
  (q.normalized || []).forEach(n => { if(n.from === x) x = n.to; });
  (q.redirects || []).forEach(r => { if(r.from === x) x = r.to; });
  return x;
}
async function fetchRefs(force){
  if(REF.busy || navigator.onLine === false) return;
  const need = SPECIES.filter(s => WIKI[s.id] && !REF.url[s.id]);
  if(!need.length) return;
  if(!force && Date.now() - (+(store.get(K+"refs.try") || 0)) < 6*3600e3) return;
  store.set(K+"refs.try", String(Date.now()));
  REF.busy = true;
  let got = 0;
  try{
    /* 1. article → its lead image, fifty titles to a request */
    const pick = {};
    for(let alt = 0; alt < 2; alt++){
      const want = need.filter(s => !pick[s.id]).map(s => ({id:s.id, t:WIKI[s.id].split("|")[alt]})).filter(w => w.t);
      for(let i = 0; i < want.length; i += 45){
        const chunk = want.slice(i, i+45);
        const j = await wget("&redirects=1&prop=pageimages&piprop=name&titles=" + encodeURIComponent(chunk.map(w => w.t).join("|")));
        const q = j.query || {}, by = {};
        (q.pages || []).forEach(pg => { if(pg.pageimage) by[pg.title] = pg.pageimage; });
        chunk.forEach(w => { const f = by[finalTitle(q, w.t)]; if(f) pick[w.id] = f; });
      }
    }
    /* 2. image → a 640 px copy and who made it */
    const ids = Object.keys(pick), info = {};
    for(let i = 0; i < ids.length; i += 45){
      const chunk = ids.slice(i, i+45), titles = chunk.map(id => "File:" + pick[id]);
      const j = await wget("&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=640&iiextmetadatafilter=Artist|LicenseShortName|LicenseUrl&titles=" + encodeURIComponent(titles.join("|")));
      const q = j.query || {}, by = {};
      (q.pages || []).forEach(pg => { if(pg.imageinfo && pg.imageinfo[0]) by[pg.title] = pg.imageinfo[0]; });
      chunk.forEach((id, k) => { const ii = by[finalTitle(q, titles[k])]; if(ii) info[id] = ii; });
    }
    /* 3. keep only open licences, then download, three at a time */
    const queue = ids.filter(id => {
      const ii = info[id], md = ii && ii.extmetadata || {};
      const lic = md.LicenseShortName && md.LicenseShortName.value || "";
      return ii && ii.thumburl && OPEN_LICENCE.test(lic) && !/\bN[CD]\b/i.test(lic);
    });
    const one = async id => {
      const ii = info[id], md = ii.extmetadata;
      try{
        const r = await fetch(ii.thumburl);
        if(!r.ok) return;
        const blob = await r.blob();
        if(!/^image\//.test(blob.type)) return;
        await idb.putRef({id, blob});
        REF.meta[id] = {file:pick[id], artist:plain(md.Artist && md.Artist.value), lic:md.LicenseShortName.value,
                        licUrl:md.LicenseUrl ? md.LicenseUrl.value : "", src:ii.descriptionurl || ""};
        REF.url[id] = URL.createObjectURL(blob);
        got++;
        if(got % 8 === 0){ setJ(K+"refs", REF.meta); if(tab === "wild" || tab === "log") render(); }
      }catch(e){}
    };
    for(let i = 0; i < queue.length; i += 3) await Promise.all(queue.slice(i, i+3).map(one));
  }catch(e){
  }finally{
    setJ(K+"refs", REF.meta);
    REF.busy = false;
    if(force) toast(got ? got + " species photos saved for use at sea." : "Could not fetch photos just now. It will try again with signal.");
    if(tab !== "cam" && tab !== "chart" && !document.activeElement.matches("input,textarea")) render();
  }
}

/* ============================================================
   PHOTOS — shoot now or import later; each one is filed under the
   landing it was taken on by its own timestamp, then waits for
   signal to be identified. Kept on this phone only.
   ============================================================ */
let PH = [];
const idb = {
  p:null,
  open(){
    if(this.p) return this.p;
    this.p = new Promise((ok, no) => {
      let r; try{ r = indexedDB.open("shorebook-galapagos", 2); }catch(e){ no(e); return; }
      r.onupgradeneeded = () => {
        const db = r.result;
        if(!db.objectStoreNames.contains("photos")) db.createObjectStore("photos", {keyPath:"id"});

/* EXIF: DateTimeOriginal and, when the camera wrote it, its UTC offset. */
function exifTime(buf){
  const v = new DataView(buf);
  if(v.byteLength < 4 || v.getUint16(0) !== 0xFFD8) return null;
  let o = 2;
  while(o + 4 < v.byteLength){
    if(v.getUint8(o) !== 0xFF) return null;
    const mk = v.getUint8(o+1), len = v.getUint16(o+2);
    if(mk === 0xE1 && v.getUint32(o+4) === 0x45786966){          /* "Exif" */
      const T = o + 10, le = v.getUint16(T) === 0x4949;
      const u16 = p => v.getUint16(p, le), u32 = p => v.getUint32(p, le);
      const str = (p, n) => { let s = ""; for(let i = 0; i < n && p+i < v.byteLength; i++){ const c = v.getUint8(p+i); if(!c) break; s += String.fromCharCode(c); } return s; };
      const ifd = (start, want) => {
        const out = {}; if(start + 2 > v.byteLength) return out;
        const n = u16(start);
        for(let i = 0; i < n; i++){
          const e = start + 2 + i*12; if(e + 12 > v.byteLength) break;
          const tag = u16(e);
          if(want.indexOf(tag) < 0) continue;
          const type = u16(e+2), cnt = u32(e+4);
          if(type === 2) out[tag] = str(cnt > 4 ? T + u32(e+8) : e+8, cnt);
          else out[tag] = u32(e+8);
        }
        return out;
      };
      const i0 = ifd(T + u32(T+4), [0x8769, 0x0132]);
      const ex = i0[0x8769] ? ifd(T + i0[0x8769], [0x9003, 0x9011]) : {};
      const dt = ex[0x9003] || i0[0x0132];
      const m = dt && dt.match(/^(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d)/);
      if(!m) return null;
      const off = ex[0x9011] && ex[0x9011].match(/^([+-])(\d\d):(\d\d)/);
      return {y:+m[1], mo:+m[2], d:+m[3], h:+m[4], mi:+m[5],
              off: off ? (off[1] === "-" ? -1 : 1) * (+off[2] + off[3]/60) : null};
    }
    if(mk === 0xDA) return null;
    o += 2 + len;
  }
  return null;
}
function exifEpoch(x){
  const wall = Date.UTC(x.y, x.mo-1, x.d, x.h, x.mi);
  if(x.off != null) return wall - x.off*3600e3;
  /* no offset: assume the camera keeps trip time, less any correction set in Know */
  const iso = new Date(wall).toISOString().slice(0,10);
  const d = DAYS.find(dd => dd.date === iso) || DAYS[DAYS.length-1];
  return wall - tzFor(d)*3600e3 - (+(store.get(K+"camoff") || 0))*3600e3;
}
/* file a moment under a day and, if it fits, a landing */
function matchTime(t){
  let d = DAYS.find(dd => localParts(t, tzFor(dd)).date === dd.date);
  if(!d) return {day:(t < epochOf(DAYS[0],"00:00") ? DAYS[0] : DAYS[DAYS.length-1]).id, site:null, act:"Outside the trip dates"};
  const list = acts(d);
  for(const a of list){
    const s = epochOf(d, a.t), e = epochOf(d, a.e);
    if(s && e && t >= s - 20*6e4 && t <= e + 30*6e4) return {day:d.id, site:siteOf(a) ? a.s : null, act:a.w};
  }
  const before = list.filter(a => epochOf(d, a.e || a.t) && epochOf(d, a.e || a.t) <= t).pop();
  if(d.tz === -5) return {day:d.id, site:"quito", act:"Quito"};
  return {day:d.id, site:null, act:before ? "Aboard, after " + before.w : "Aboard, morning"};
}
function whenText(p){

}
function loadImg(file){

    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => ok({img, url}); img.onerror = () => { URL.revokeObjectURL(url); no(new Error("unreadable")); };

  const w = Math.round((img.naturalWidth || img.width) * s), h = Math.round((img.naturalHeight || img.height) * s);

async function addFiles(files){

    if(t == null) t = Date.now();

      loaded = await loadImg(f);
      big = await drawTo(loaded.img, 1568, .86);

}
function b64(p){

async function saveFile(name, text, mime){
  const file = new File([text], name, {type:mime});

    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:name}); return; }
  }catch(e){ if(e && e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}

async function importLog(file){

/* ============================================================
   CHART — drawn from coordinates, always. With signal it lays
   OpenStreetMap tiles under the pins and the service worker keeps
   the ones you have looked at. Nothing is fetched in bulk.
   ============================================================ */
const RAD = Math.PI/180, Z0 = 8, TS = 256;
const wx = lon => (lon + 180)/360 * TS * 2**Z0;
const wy = lat => { const s = Math.sin(lat*RAD); return (0.5 - Math.log((1+s)/(1-s))/(4*Math.PI)) * TS * 2**Z0; };
const ll = c => { const [a,b] = String(c).split(",").map(Number); return {lat:a, lon:b}; };
function kmBetween(a, b){
  const dl = (b.lat-a.lat)*RAD, dn = (b.lon-a.lon)*RAD;
  const h = Math.sin(dl/2)**2 + Math.cos(a.lat*RAD)*Math.cos(b.lat*RAD)*Math.sin(dn/2)**2;
  return 12742 * Math.asin(Math.sqrt(h));
}
const COMPASS = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
function compass(a, b){
  const y = Math.sin((b.lon-a.lon)*RAD)*Math.cos(b.lat*RAD);
  const x = Math.cos(a.lat*RAD)*Math.sin(b.lat*RAD) - Math.sin(a.lat*RAD)*Math.cos(b.lat*RAD)*Math.cos((b.lon-a.lon)*RAD);
  return COMPASS[Math.round(((Math.atan2(y,x)/RAD + 360) % 360)/22.5) % 16];
}
const chart = {cx:0, cy:0, s:1, W:0, H:0, fitted:null, sel:null, pins:[], tiles:new Map()};
const geo = {on:false, fix:null, err:null, id:null};
function chartSites(){
  /* every visitor site in itinerary order, with the days it is visited */
  const out = [], ix = {};
  DAYS.forEach((d, di) => acts(d).forEach(a => {
    const st = siteOf(a); if(!st || a.s === "baltra" && di !== 2) return;
    if(ix[a.s] == null){ ix[a.s] = out.length; out.push({id:a.s, st, days:[di], L:ll(st.c)}); }
    else if(out[ix[a.s]].days.indexOf(di) < 0) out[ix[a.s]].days.push(di);
  }));
  return out;
}
function fitTo(points){
  if(!points.length) return;
  const xs = points.map(p => wx(p.lon)), ys = points.map(p => wy(p.lat));
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  chart.cx = (x0+x1)/2; chart.cy = (y0+y1)/2;
  const sx = (chart.W - 90)/Math.max(x1-x0, .05), sy = (chart.H - 90)/Math.max(y1-y0, .05);
  chart.s = Math.max(.5, Math.min(256, Math.min(sx, sy), 64));
}
function fitScope(scope){
  const all = chartSites();
  let pts;
  if(scope === "me" && geo.fix) pts = [{lat:geo.fix.lat - .02, lon:geo.fix.lon - .02}, {lat:geo.fix.lat + .02, lon:geo.fix.lon + .02}];
  else if(scope === "day"){
    const d = day();
    pts = acts(d).map(a => siteOf(a)).filter(Boolean).map(s => ll(s.c));
    if(d.id === "d2") pts = pts.concat(SITES.quito.walk.map(w => ll(w.c)));
    if(pts.length === 1) pts = [{lat:pts[0].lat - .05, lon:pts[0].lon - .05}, {lat:pts[0].lat + .05, lon:pts[0].lon + .05}];
  } else pts = all.filter(s => s.st !== SITES.quito).map(s => s.L);
  fitTo(pts); chart.fitted = scope;
}
function renderChart(){
  let html = '<div class="locbar" id="locbar"></div>' +
    '<div class="chart-ctl"><button class="wide" data-fit="route">Route</button><button class="wide" data-fit="day">Day</button><button class="wide" data-fit="me">Me</button>' +
    '<button data-zoom="1.6" aria-label="Zoom in">+</button><button data-zoom="0.625" aria-label="Zoom out">−</button></div>' +
    '<div class="chartwrap" id="chartHost"><svg id="chartSvg" xmlns="http://www.w3.org/2000/svg"><g id="tileL"></g><g id="drawL"></g></svg>' +
    '<span class="attrib">© OpenStreetMap contributors</span></div><div id="chartCard"></div>' +
    '<p class="note" style="margin-top:10px">With signal, the chart lays the map under the pins and keeps every piece you look at for later. Look at each island once before you fly from Quito, and it will be there at sea.</p>';
  $("#panel").innerHTML = html;
